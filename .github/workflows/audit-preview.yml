name: Audit ArchiSpotter preview
on:
  push:
    paths:
      - 'preview/**'
      - 'scripts/audit-preview.mjs'
      - '.github/workflows/audit-preview.yml'
  pull_request:
    paths:
      - 'preview/**'
      - 'scripts/audit-preview.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax, dependencies and editorial consistency
        run: node scripts/audit-preview.mjs
