name: Generate ArchiSpotter iPhone icon
on:
  push:
    paths:
      - 'archispotter-icon.svg'
      - 'preview/archispotter-icon.svg'
      - '.github/workflows/build-archispotter-icon.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render iOS and PWA icons
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          for prefix in ('', 'preview/'):
              src=prefix+'archispotter-icon.svg'
              for size in (180,192,512):
                  output=prefix+('apple-touch-icon.png' if size==180 else 'icon-'+str(size)+'.png')
                  cairosvg.svg2png(url=src,write_to=output,output_width=size,output_height=size)
          PY
      - name: Commit rendered icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apple-touch-icon.png icon-192.png icon-512.png preview/apple-touch-icon.png preview/icon-192.png preview/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m 'Render borderless iPhone and PWA icon PNGs'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
