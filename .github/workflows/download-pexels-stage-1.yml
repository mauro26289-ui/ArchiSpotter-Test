name: Download verified Pexels photos group 1
on:
  push:
    paths:
      - 'scripts/download-pexels-stage-1.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and verify images
        id: download
        continue-on-error: true
        run: node scripts/download-pexels-stage-1.mjs
      - name: Commit downloaded files and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/assets/photos/pexels docs/audits/pexels-stage-1-group-1-results.json
          git commit -m "Store Pexels group 1 photos locally with checksum audit" || exit 0
          git pull --rebase
          git push
      - name: Fail if download incomplete
        if: steps.download.outcome == 'failure'
        run: exit 1
