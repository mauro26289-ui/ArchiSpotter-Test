name: Verify Unsplash stage 1 photo sources
on:
  push:
    paths:
      - 'scripts/verify-unsplash-stage-1.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-unsplash-stage-1.mjs
      - name: Publish audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/unsplash-stage-1-http.json
          git commit -m "Audit Unsplash stage 1 photo CDN URLs" || exit 0
          git push
